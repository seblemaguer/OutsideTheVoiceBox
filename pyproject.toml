[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61",
]

[project]
name = "outsidethevoicebox"
version = "0.0.1"
description='Outside The Voice Box'
readme = {file="README.md", content-type = "text/markdown"}
authors = [
  {name="Éva Székely", email="szekely@kth.se"}
]
requires-python = ">=3.12, <3.13"
dependencies = [
  "coqui-tts[codec]",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchcodec==0.9.0",
  "transformers==5.0.0",
  "unidecode",
  "librosa",
  "pandas",
  "matplotlib",
  "g2p_en",
  "hydra-core",
  "omegaconf"
]

[project.optional-dependencies]
dev = [
  "pre-commit",
  "black",
  "flake8",
  "basedpyright"
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinfile
)/
'''

[tool.flake8]
max-line-length = 120

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src"]
exclude = ["input/", "output/", "**/.venv", "**/__pycache__", "build/", "dist/", "models/"]
